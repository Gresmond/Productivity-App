# Builds Productivity.dmg on a GitHub-hosted Mac.
# Push a tag like v1.0.0 to publish it as a GitHub Release; "Run workflow"
# on the Actions tab builds it as a downloadable artifact without releasing.
name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # The trial fonts are committed only in encrypted form.
      - name: Decrypt fonts
        env:
          FONTS_PASSPHRASE: ${{ secrets.FONTS_PASSPHRASE }}
        # Decrypt to a file first: macOS tar happily "extracts" empty input,
        # which would hide a gpg failure.
        run: |
          command -v gpg >/dev/null || brew install gnupg
          if [ -z "$FONTS_PASSPHRASE" ]; then
            echo "::error title=Fonts::The FONTS_PASSPHRASE secret is empty or missing."
            exit 1
          fi
          if ! printf '%s' "$FONTS_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 -d -o fonts.tar.gz fonts.tar.gz.gpg 2>gpg.log; then
            echo "::error title=Fonts::Could not decrypt fonts: $(tr '\n' ' ' < gpg.log)"
            exit 1
          fi
          tar -xzf fonts.tar.gz
          echo "::notice title=Fonts::Unpacked $(find assets/fonts -type f | wc -l | tr -d ' ') font files."

      # On failure, repeat the error lines and the end of the output as
      # annotations, which (unlike the log) are visible without signing in.
      - name: Build app
        run: |
          set -o pipefail
          if ! flutter build macos --release 2>&1 | tee build.log; then
            grep -iE 'error|failed' build.log | head -n 8 | while IFS= read -r line; do
              echo "::error title=Build error::${line}"
            done
            tail -n 60 build.log | awk '{ printf "%s%%0A", $0 }' | sed 's/^/::error title=End of build output::/'
            echo
            exit 1
          fi

      # A disk image with the app next to an Applications shortcut, so
      # installing is a single drag.
      - name: Make disk image
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/Productivity.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Productivity -srcfolder dmg -ov -format UDZO Productivity.dmg

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Productivity-macOS
          path: Productivity.dmg

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Productivity.dmg
