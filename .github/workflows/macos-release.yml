# Builds Eclipse.dmg on a GitHub-hosted Mac.
# Each push to main whose pubspec.yaml version has no release yet publishes
# one, tagged v<version>; "Run workflow" on the Actions tab builds it as a
# downloadable artifact without releasing.
name: macOS release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build still running: only the latest version
# needs releasing.
concurrency:
  group: macos-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          version="${version%%+*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # The sign-in client stays out of the repo (see .gitignore); its secret
      # comes from the repo's GOOGLE_CLIENT_SECRET.
      - name: Write Google sign-in client
        if: steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error title=No Google client secret::Add GOOGLE_CLIENT_SECRET under Settings > Secrets and variables > Actions."
            exit 1
          fi
          cat > lib/data/google_client.dart <<DART
          const googleClientId = '972544414239-80se3hktkrmo65umjut0fvpj12nvsa9k.apps.googleusercontent.com';
          const googleClientSecret = '$SECRET';
          DART

      # On failure, repeat the error lines and the end of the output as
      # annotations, which (unlike the log) are visible without signing in.
      - name: Build app
        if: steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          if ! flutter build macos --release 2>&1 | tee build.log; then
            grep -iE 'error|failed' build.log | head -n 8 | while IFS= read -r line; do
              echo "::error title=Build error::${line}"
            done
            tail -n 60 build.log | awk '{ printf "%s%%0A", $0 }' | sed 's/^/::error title=End of build output::/'
            echo
            exit 1
          fi

      # A disk image with the app next to an Applications shortcut, so
      # installing is a single drag.
      - name: Make disk image
        if: steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/Eclipse.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Eclipse -srcfolder dmg -ov -format UDZO Eclipse.dmg

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Eclipse-macOS
          path: Eclipse.dmg

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.new == 'true' && github.event_name == 'push'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Eclipse ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Eclipse.dmg
