# Builds Eclipse.dmg on a GitHub-hosted Mac.
# Push a tag like v1.0.0 to publish it as a GitHub Release; "Run workflow"
# on the Actions tab builds it as a downloadable artifact without releasing.
name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # On failure, repeat the error lines and the end of the output as
      # annotations, which (unlike the log) are visible without signing in.
      - name: Build app
        run: |
          set -o pipefail
          if ! flutter build macos --release 2>&1 | tee build.log; then
            grep -iE 'error|failed' build.log | head -n 8 | while IFS= read -r line; do
              echo "::error title=Build error::${line}"
            done
            tail -n 60 build.log | awk '{ printf "%s%%0A", $0 }' | sed 's/^/::error title=End of build output::/'
            echo
            exit 1
          fi

      # A disk image with the app next to an Applications shortcut, so
      # installing is a single drag.
      - name: Make disk image
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/Eclipse.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Eclipse -srcfolder dmg -ov -format UDZO Eclipse.dmg

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Eclipse-macOS
          path: Eclipse.dmg

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Eclipse.dmg
