# Builds Productivity.dmg on a GitHub-hosted Mac.
# Push a tag like v1.0.0 to publish it as a GitHub Release; "Run workflow"
# on the Actions tab builds it as a downloadable artifact without releasing.
name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # The trial fonts are committed only in encrypted form.
      - name: Decrypt fonts
        env:
          FONTS_PASSPHRASE: ${{ secrets.FONTS_PASSPHRASE }}
        run: |
          echo "$FONTS_PASSPHRASE" | gpg --batch --quiet --passphrase-fd 0 -d fonts.tar.gz.gpg | tar -xzf -

      - run: flutter build macos --release

      # A disk image with the app next to an Applications shortcut, so
      # installing is a single drag.
      - name: Make disk image
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/Productivity.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Productivity -srcfolder dmg -ov -format UDZO Productivity.dmg

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Productivity-macOS
          path: Productivity.dmg

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Productivity.dmg
